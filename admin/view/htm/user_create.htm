<script>
var jform = $('#form');
var jsubmit = $('#submit');
var jemail = jform.find('input[name="email"]');
jform.on('submit', function() {
	var email = jemail.val().trim();
	if(!email) {
		jemail.alert('<?php echo lang('please_input_email');?>').focus();
		return false;
	}
	if(!xo.is_email(email)) {
		jemail.alert('<?php echo lang('email_format_mismatch');?>').focus();
		return false;
	}
	jform.reset();
	jsubmit.button('loading');
	var postdata = jform.serialize();
	$.xpost(jform.attr('action'), postdata, function(code, message) {
		if(code == 0) {
			$.alert(message);
			jsubmit.text(message).delay(350).location(xo.url('user-list'));
		} else if(xo.is_number(code)) {
			alert(message);
			jsubmit.button('reset');
		} else {
			alert(message);
			jform.find('[name="'+code+'"]').alert(message).focus();
			jsubmit.button('reset');
		}
	});
	return false;
});

$('#nav li.nav-item-user').addClass('active');

</script>
