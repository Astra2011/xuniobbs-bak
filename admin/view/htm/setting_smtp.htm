<script>

// 模板初始化
var maxrowid = Math.max(xo.array_keys(smtplist));
var smtplist = <?php echo xo_json_encode($smtplist);?>;
var jsmtp_tpl = $('#smtp_tpl');
var jsmtp_body = $('#smtp_body');
var tpl = jsmtp_tpl.text();
function row_add(v) {
	var s = xo.template(tpl, v);
	jsmtp_body.append(s);
}
$.each(smtplist, function(k, v) {
	v.rowid = k;
	row_add(v);
});

var jform = $("#form");
var jsubmit = $("#submit");
jform.on('submit', function(){
	jform.reset();
	jsubmit.button('loading');
	var postdata = jform.serialize();
	$.xpost(jform.attr('action'), postdata, function(code, message) {
		if(code == 0) {
			$.alert(message);
			jsubmit.text(message).delay(500).button('reset');
			return;
		} else {
			alert(message);
			jsubmit.button('reset');
		}
	});
	return false;
});

// 删除 delete
var jarrlist = $('.arrlist');
var jdelete = $('a.row_delete');
jarrlist.on('click', 'a.row_delete', function() {
	var jthis = $(this);
	var jtr = jthis.parents('tr');
	var rowid = jtr.attr('rowid');
	jtr.remove();
	return false;
});

// 增加 add
var jadd = $('a.row_add');
jadd.on('click', function() {
	var v = {email: '', host: '', port: '', user: '', pass: '', rowid: ++maxrowid};
	row_add(v);
	return false;
});


// SMTP 发件测试
var jsmtp_test_form = $('#smtp_test_form');
var jsmtp_test_submit = $('#smtp_test_submit');
jsmtp_test_form.on('submit', function() {
	var to = $('#smtp_test_to').val();
	if(!to) {
		alert('<?php echo lang('smtp_test_fill_to');?>');
		return false;
	}
	// 读取当前第一行的 SMTP 配置
	var first_row = jsmtp_body.find('tr').first();
	var email = first_row.find('input[name="email[]"]').val();
	var host = first_row.find('input[name="host[]"]').val();
	var port = first_row.find('input[name="port[]"]').val();
	var user = first_row.find('input[name="user[]"]').val();
	var pass = first_row.find('input[name="pass[]"]').val();
	if(!host || !port) {
		alert('<?php echo lang('smtp_test_fill_config');?>');
		return false;
	}
	jsmtp_test_submit.button('loading');
	var postdata = {
		to: to,
		email: email,
		host: host,
		port: port,
		user: user,
		pass: pass
	};
	$.xpost('<?php echo url('setting-smtp_test');?>', postdata, function(code, message) {
		jsmtp_test_submit.button('reset');
		if(code == 0) {
			alert(message);
		} else {
			alert(message);
		}
	});
	return false;
});

$('#nav li.nav-item-setting').addClass('active');

</script>
