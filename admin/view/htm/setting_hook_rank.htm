<script>
var hookrank = {
	// dir 按当前展示顺序排列
	order: <?php echo xo_json_encode(array_values(array_map(function($p){ return $p['dir']; }, $pluginlist)));?>
};
var jtable = $('.table-responsive');

jtable.on('click', '.hook_rank_up, .hook_rank_down', function() {
	var jbtn = $(this);
	var dir = jbtn.attr('data-dir');
	var idx = hookrank.order.indexOf(dir);
	if(idx < 0) return false;
	var dir2 = null;
	if(jbtn.hasClass('hook_rank_up')) {
		if(idx <= 0) return false;
		dir2 = hookrank.order[idx - 1];
	} else {
		if(idx >= hookrank.order.length - 1) return false;
		dir2 = hookrank.order[idx + 1];
	}
	if(!dir2) return false;

	jbtn.button('loading');
	$.xpost('<?php echo url('setting-hook_rank');?>', {dir: dir, dir2: dir2}, function(code, message) {
		if(code == 0) {
			// 交换本地顺序并刷新页面，让排序立即生效
			window.location.reload();
		} else {
			alert(message);
			jbtn.button('reset');
		}
	});
	return false;
});

$('#nav li.nav-item-setting').addClass('active');
</script>
