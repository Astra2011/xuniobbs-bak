<script>
// 每个 hook 点内，dir 按当前展示顺序排列（与后端排序一致）
var hookrank = <?php echo xo_json_encode(array_map(function($arr){ return array_values(array_map(function($p){ return $p['dir']; }, $arr)); }, $hooklist));?>;
var jtab = $('.tab-content');

jtab.on('click', '.hook_rank_up, .hook_rank_down', function() {
	var jbtn = $(this);
	var hookname = jbtn.attr('data-hook');
	var dir = jbtn.attr('data-dir');
	var order = hookrank[hookname];
	if(!order) return false;
	var idx = order.indexOf(dir);
	if(idx < 0) return false;
	var dir2 = null;
	if(jbtn.hasClass('hook_rank_up')) {
		if(idx <= 0) return false;
		dir2 = order[idx - 1];
	} else {
		if(idx >= order.length - 1) return false;
		dir2 = order[idx + 1];
	}
	if(!dir2) return false;

	jbtn.button('loading');
	$.xpost('<?php echo url('setting-hook_rank');?>', {hookname: hookname, dir: dir, dir2: dir2}, function(code, message) {
		if(code == 0) {
			window.location.reload();
		} else {
			alert(message);
			jbtn.button('reset');
		}
	});
	return false;
});

$('#nav li.nav-item-setting').addClass('active');
</script>

<!--{hook admin_setting_hook_rank_js.htm}-->
